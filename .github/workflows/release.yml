name: Release bootstrap

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME"
          bash -n bin/evgenium-waydroid-mapper scripts/install.sh scripts/uninstall.sh

      - name: Build portable bootstrap
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          asset="evgenium-waydroid-mapper-${version}-linux-x86_64.tar.gz"
          mkdir -p dist/package
          cp -a VERSION bin scripts dist/package/
          tar -C dist/package -czf "dist/$asset" .
          (cd dist && sha256sum "$asset" > "$asset.sha256")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256

