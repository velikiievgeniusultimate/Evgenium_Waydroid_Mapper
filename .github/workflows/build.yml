name: Build
on:
  pull_request:
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    container: fedora:latest
    steps:
      - name: Install container tools and build dependencies
        run: dnf -y install git tar gzip cmake ninja-build gcc gcc-c++ pkgconf-pkg-config qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtwayland-devel wayland-devel wayland-protocols-devel python3
      - uses: actions/checkout@v4
      - name: Verify native runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Test device profile helper
        run: python3 -m unittest discover -s tests -v
      - name: Build
        run: cmake --build build
