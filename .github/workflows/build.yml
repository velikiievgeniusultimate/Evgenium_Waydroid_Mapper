name: Build
on:
  pull_request:
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    # Release binaries are intentionally built against Debian 13 rather than a
    # rolling "latest" image. EWM is distributed as one portable Linux binary
    # per CPU architecture, so silently inheriting a newer Qt/glibc from the
    # build container can make an otherwise unchanged release fail before
    # main() on Arch or Fedora. Debian 13 provides Qt 6.8 and glibc 2.41 while
    # still exposing QNativeInterface::QWaylandApplication (Qt >= 6.5).
    container: debian:13
    steps:
      - name: Install container tools and build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git tar gzip ca-certificates cmake ninja-build gcc g++ binutils pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-wayland-dev \
            libwayland-dev libwayland-bin wayland-protocols python3
      - uses: actions/checkout@v4
      - name: Verify native runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Test device profile helper
        run: python3 -m unittest discover -s tests -v
      - name: Build
        run: cmake --build build
      - name: Guard portable Linux ABI baseline
        shell: bash
        run: |
          set -euo pipefail
          binary="build/evgenium-waydroid-mapper"
          readelf --version-info "$binary" > build/version-needs.txt
          cat build/version-needs.txt
          if grep -Eq 'GLIBC_2\.(4[2-9]|[5-9][0-9])' build/version-needs.txt; then
            echo "EWM unexpectedly requires glibc newer than the Debian 13 baseline." >&2
            exit 1
          fi
          if grep -Eq 'Qt_6\.(9|[1-9][0-9])' build/version-needs.txt; then
            echo "EWM unexpectedly requires Qt 6.9+ at load time." >&2
            exit 1
          fi
